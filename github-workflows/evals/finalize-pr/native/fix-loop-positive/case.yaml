schema_version: "1.1"
name: finalize-pr-fix-loop-positive
tags: [development, should-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    In a fictional public repo, PR #33 on the current branch has one open
    code-scanning alert in the diff, CI that is re-running after a force
    push, and two unresolved review threads whose suggestions would break a
    deliberate retry guard. Describe how you would drive this PR to
    merge-ready without merging it, as a text-only plan. Decide from these
    supplied facts without writing files, running commands, or inventing
    results.
graders:
  - name: selected-finalize-pr
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?finalize-pr"'
  - name: fix-loop-rules
    type: llm
    criteria: >-
      PASS only if CI monitoring starts in the background while other fixes
      run in parallel, review feedback is processed through the thread
      resolver informed by a context brief so the deliberate retry guard is
      not blindly "fixed", the code-scanning alert goes through
      resolve-codeql separately from CI, simplify runs exactly once after all
      fixes, metadata is regenerated through a delegate, and the closing
      step is a fresh live run of every Phase 3 gate field. FAIL if fixes are
      serialized behind CI, reviewer suggestions are applied uncritically,
      simplify runs more than once or before fixes, or readiness is declared
      from the packet instead of a fresh gate run.
