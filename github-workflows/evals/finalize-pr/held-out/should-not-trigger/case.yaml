schema_version: '1.1'
name: held-out-finalize-pr-should-not-trigger
runs: 3
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
  prompt: |
    I have uncommitted changes for a documentation typo fix in a fictional
    public repo. Commit them with a conventional message, push, and open a PR
    for them; I will handle review from there. Return a text-only plan, not
    files or executed commands. This fictional exercise supplies no
    repository, remote, permission config, or CI. Identify prerequisites
    instead of inventing them, and keep dependent steps conditional. You may
    read available workflow guidance, but cannot use a shell, edit files,
    install anything, access credentials, or contact services.
graders:
  - name: output-contract
    type: llm
    focus: last_message
    criteria: |
      PASS if the answer treats this as the commit-push-PR-creation pipeline
      owned by the ship workflow: selective staging, conventional commit,
      local validation before push, PR creation without arming auto-merge,
      and pre-push simplification happening in that pipeline rather than in
      finalization. FAIL if it runs the finalization fix loop, CodeQL and
      readiness gates, or metadata phases as a way to create the PR, or
      claims a PR was opened without the creation pipeline, since
      finalization assumes a PR already exists.
  - name: no-skill-invocation
    type: tool_used
    arm: both
    tool: Skill
    input_match: '"skill"\s*:\s*"github-workflows:finalize-pr"'
    min: 0
    max: 0
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
