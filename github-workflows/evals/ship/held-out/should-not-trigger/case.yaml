schema_version: '1.1'
name: held-out-ship-should-not-trigger
runs: 3
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
  prompt: |
    Our public fictional repo uses Git Flow: the default branch is develop. The
    release-please PR has finished auto-merging into develop, and develop's
    checks are green. Ship the release to main now so it gets tagged.
    Return a text-only plan, not files or executed commands. This fictional
    exercise supplies no repository, remote, permission config, or CI. Identify
    prerequisites instead of inventing them, and keep dependent steps
    conditional. You may read available workflow guidance, but cannot use a
    shell, edit files, install anything, access credentials, or contact
    services.
graders:
  - name: output-contract
    type: llm
    focus: last_message
    criteria: |
      PASS if the answer declines to ship a hand promotion: on a git-flow
      repo, promotion from develop to main is daily and automatic, and
      agents do not promote by hand. It may note that main accepts merge
      commits only and that release-please tags the promoted commit itself.
      FAIL if it plans the commit/push/PR-creation pipeline or any manual
      merge, squash, or rebase to move develop into main, hand-tags or edits
      the CHANGELOG, or claims a tag was created without release-please.
  - name: no-skill-invocation
    type: tool_used
    arm: both
    tool: Skill
    input_match: '"skill"\s*:\s*"github-workflows:ship"'
    min: 0
    max: 0
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
