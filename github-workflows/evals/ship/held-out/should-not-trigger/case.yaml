schema_version: '1.1'
name: held-out-ship-should-not-trigger
runs: 3
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
  prompt: |
    Our public fictional repo uses Git Flow: the default branch is develop. The
    release-please PR has finished auto-merging into develop, and develop's
    checks are green. Ship the release to main now so it gets tagged.
    Return a text-only plan, not files or executed commands. This fictional
    exercise supplies no repository, remote, permission config, or CI. Identify
    prerequisites instead of inventing them, and keep dependent steps
    conditional. You may read available workflow guidance, but cannot use a
    shell, edit files, install anything, access credentials, or contact
    services.
graders:
  - name: output-contract
    type: llm
    focus: last_message
    criteria: |
      PASS if the answer routes the develop-to-main promotion to the release
      promotion workflow (promote-release): it confirms the release-please PR
      landed on develop first, validates develop, and promotes with a merge
      commit only, because main bans squash and rebase by ruleset and
      release-please tags the promoted commit itself. It may note that no
      version, CHANGELOG entry, or tag may be invented by hand. FAIL if it
      plans the commit/push/PR-creation pipeline as the way to move develop
      into main, squashes or rebases the promotion, hand-tags or edits the
      CHANGELOG, or claims a tag was created without release-please.
  - name: no-skill-invocation
    type: tool_used
    arm: both
    tool: Skill
    input_match: '"skill"\s*:\s*"github-workflows:ship"'
    min: 0
    max: 0
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
