schema_version: "1.1"
name: merge-pr-default-merge-positive
tags: [development, should-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Fictional PR #71 is on the current branch of a public trunk repo whose
    default branch is main: approved, CI green, threads resolved, and a
    code-scanning alert count of 0. No merge method flag is passed. Describe
    exactly how you would merge it and clean up, as a text-only plan. Decide
    from these supplied facts without writing files, running commands, or
    inventing results.
graders:
  - name: selected-merge-pr
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?merge-pr"'
  - name: merge-rules
    type: llm
    criteria: >-
      PASS only if the plan re-runs the readiness gate and code-scanning
      count on this invocation, resolves the merge method from repo settings
      before any merge attempt, uses a merge commit as the default, does not
      regenerate PR metadata, merges without --delete-branch, and cleans up
      the remote branch tolerantly, the local worktree, the branch ref, and
      the base branch sync. FAIL if it trusts the packet's green values
      without a live gate, regenerates the PR title or body, retries after a
      failed merge command, or deletes branches with --delete-branch.
