schema_version: '1.1'
name: held-out-merge-pr-should-trigger
runs: 3
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
  prompt: |
    Fictional PR #96 is on the current branch of a public trunk repo whose
    default branch is main: approved, CI green, no unresolved threads, and a
    code-scanning alert count of 0. Merge it with whatever method the repo
    prefers by default, and clean up the branch afterwards. Return a
    text-only walkthrough, not files or executed commands. This fictional
    exercise supplies no repository, remote, permission config, or CI.
    Identify prerequisites instead of inventing them, and keep dependent
    steps conditional. You may read available workflow guidance, but cannot
    use a shell, edit files, install anything, access credentials, or
    contact services.
graders:
  - name: output-contract
    type: llm
    focus: last_message
    criteria: |
      PASS if the walkthrough re-runs the readiness gate and the separate
      code-scanning alert count on this invocation, checks the hard stops
      (open, not a draft, at most 100 threads), resolves the merge method
      from the repo's allowed settings before merging (merge commit unless
      merge commits are disallowed, in which case squash is reported as a
      fallback), merges without --delete-branch, then deletes the remote
      branch tolerantly, removes the local worktree and branch ref, and
      syncs the base branch. It treats PR metadata as finalization's
      responsibility and does not regenerate it. FAIL if it trusts the
      green status quoted in the prompt without a live gate, retries after
      a failed merge command, or squashes without the repo settings
      requiring it.
  - name: actual-skill-invocation
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"github-workflows:merge-pr"'
    min: 1
    max: 12
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
