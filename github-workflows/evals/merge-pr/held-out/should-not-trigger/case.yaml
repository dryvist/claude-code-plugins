schema_version: '1.1'
name: held-out-merge-pr-should-not-trigger
runs: 3
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
  prompt: |
    Time to cut version 4.2.0 of our fictional public repo, which uses Git
    Flow with develop as the default branch. Confirm the release-please PR
    has finished merging into develop, then get develop into main with a
    merge commit so release-please can tag the release. Do not squash
    anything. Return a text-only plan, not files or executed commands. This
    fictional exercise supplies no repository, remote, permission config, or
    CI. Identify prerequisites instead of inventing them, and keep dependent
    steps conditional. You may read available workflow guidance, but cannot
    use a shell, edit files, install anything, access credentials, or
    contact services.
graders:
  - name: output-contract
    type: llm
    focus: last_message
    criteria: |
      PASS if the answer refuses a hand promotion: on a git-flow repo,
      promotion from develop to main is daily and automatic, and agents do
      not promote by hand. It may note that main accepts merge commits only
      and that release-please tags the promoted commit on main itself. FAIL
      if it plans to merge, squash, or rebase develop into main by hand,
      treats this as an ordinary PR merge, or performs any release
      preparation (versions, CHANGELOG, tags) manually.
  - name: no-skill-invocation
    type: tool_used
    arm: both
    tool: Skill
    input_match: '"skill"\s*:\s*"github-workflows:merge-pr"'
    min: 0
    max: 0
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
