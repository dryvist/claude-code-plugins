schema_version: "1.1"
name: replan-resume-collision
tags: [development, should-not-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    The plan checked out accurate at the end of last session and nothing has
    changed since. Continue the work from the next unchecked item. Text-only
    plan; decide from these supplied facts without writing files, running
    commands, or inventing results.
graders:
  - name: no-replan-invocation
    type: tool_used
    arm: both
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?replan"'
    min: 0
    max: 0
  - name: routes-to-resume-rules
    type: llm
    criteria: >-
      PASS if the answer treats this as continuation from the plan as
      written: verify-before-trust on the next open item, then proceed, with
      no ground-truth sweep, no checkbox reclassification, and no rewrite of
      the plan file; it may name the resume skill as the fitting owner. FAIL
      if it runs a full replan reconciliation for a plan nothing indicates is
      stale, rewrites the plan, or re-derives merged history as the entry
      step.
