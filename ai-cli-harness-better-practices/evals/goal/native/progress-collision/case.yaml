schema_version: "1.1"
name: goal-progress-collision
tags: [development, should-not-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    How far along is this session? List what is done versus what remains from
    the supplied state: the parser migration is merged, the docs update is
    half written, and the benchmark rerun is queued. Text-only answer; decide
    from these supplied facts without writing files, running commands, or
    inventing results.
graders:
  - name: no-goal-invocation
    type: tool_used
    arm: both
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?goal"'
    min: 0
    max: 0
  - name: routes-to-status-rules
    type: llm
    criteria: >-
      PASS if the answer reports a done-versus-remaining progress view of the
      supplied state (merged work complete, docs half written, benchmark
      queued) rather than distilling the session into one objective statement
      with success criteria; it may name the session-status skill as the
      fitting owner. FAIL if it emits a single goal statement, derives a new
      objective from the remaining items, or applies a 4000-character cap
      measurement to a progress view.
