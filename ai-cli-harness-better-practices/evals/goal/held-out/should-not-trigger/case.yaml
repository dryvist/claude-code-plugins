schema_version: '1.1'
name: held-out-goal-should-not-trigger
runs: 3
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
  prompt: |
    Give me a done-versus-remaining snapshot of this session: what has
    landed, what is still open, and anything blocked. This is a progress
    check, not a new objective. All state is supplied here. Only text output
    and reading are authorized; no shell, file changes, installs,
    credentials, or service calls.

    Done: retry path committed and tested; CI green on the branch.
    Open: changelog entry; release notes draft.
    Blocked: staging deploy awaiting credentials.
graders:
  - name: output-contract
    type: llm
    focus: last_message
    criteria: |
      PASS if the answer reports the requested done-versus-remaining progress
      view from the supplied state — landed work, open items, and the blocked
      deploy — as a status snapshot rather than a single objective statement.
      It may name the session-status skill as the fitting owner for this
      view. FAIL if it converts the progress check into one goal statement
      with success criteria, derives a new objective from the open items, or
      claims to have measured a goal cap.
  - name: no-skill-invocation
    type: tool_used
    arm: both
    tool: Skill
    input_match: '"skill"\s*:\s*"ai-cli-harness-better-practices:goal"'
    min: 0
    max: 0
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
