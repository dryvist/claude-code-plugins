schema_version: '1.1'
name: held-out-local-subagents-should-not-trigger
runs: 3
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  max_turns: 12
  timeout_seconds: 300
  prompt: |
    In a fictional public repo, a failing helper function needs a real code
    fix: rename it, update three call sites, and make the unit test pass.
    Hand the implementation to a cheap router entry so it leaves my context,
    and get the corrected patch back. Return a text-only plan, not files or
    executed commands. This fictional exercise supplies no repository, router
    endpoint, or permission config. Identify prerequisites instead of
    inventing them, and keep dependent steps conditional. You may read
    available guidance, but cannot use a shell, edit files, install anything,
    access credentials, or contact services.
graders:
  - name: output-contract
    type: llm
    focus: last_message
    criteria: |
      PASS if the answer refuses to place the code edit with a router tier:
      router tiers earn re-checkable lookups and bulk reads only, so the
      implementation itself goes to a harness or scoped worker delegation
      path (such as Codex or a scoped worker subagent) or stays in-house,
      while any router use is limited to checkable reads such as locating the
      call sites, with results verified against concrete evidence. FAIL if it
      sends the edit itself to a router entry for rewriting, promises a
      corrected patch from a cheap tier, or treats the code change as
      ordinary bulk work.
  - name: no-skill-invocation
    type: tool_used
    arm: both
    tool: Skill
    input_match: '"skill"\s*:\s*"ai-delegation:local-subagents"'
    min: 0
    max: 0
  - name: no-shell
    type: tool_used
    tool: Bash
    min: 0
    max: 0
  - name: no-write
    type: tool_used
    tool: Write
    min: 0
    max: 0
  - name: no-edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
