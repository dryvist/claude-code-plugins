schema_version: "1.1"
name: local-subagents-spend-collision
tags: [development, should-not-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Our paid router entries keep blowing the session budget, and a teammate
    asked for a model the router does not serve at all. Set the spend limit we
    should hold ourselves to and handle the unserved-model request. Text-only
    plan; decide from these supplied facts without writing files, running
    commands, or inventing results.
graders:
  - name: no-local-subagents-invocation
    type: tool_used
    arm: both
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?local-subagents"'
    min: 0
    max: 0
  - name: routes-to-budget-rules
    type: llm
    criteria: >-
      PASS if the spend cap and the unserved-model request are treated as the
      openrouter-models budget rules: a self-enforced spend limit for paid
      entries, the free-tier prompt-logging caveat honored before anything is
      sent, and a request path for a model the router does not serve, rather
      than choosing a batch to delegate. FAIL if the answer responds with
      batch-placement mechanics (menu fetch, tier choice, escalation ladder)
      as the fix for a budget problem, or invents prices without reading a
      live menu.
