schema_version: "1.1"
name: premium-agent-orchestration-ladder-control
tags: [development, execution, execution-control, discrimination]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Assign a rung to each backlog item from the cheapest-capable ladder, or
    name why it cannot be delegated: (a) summarize a public changelog for
    release notes, checkable against the changelog; (b) rotate the database
    credentials across two environments; (c) decide whether this quarter's
    migration may drop the legacy column; (d) after (c) is decided, apply the
    bounded edit to the migration script under a yes/no review check. Return
    only the rung per item and the reasoning; assess the supplied items only,
    with no operations.
graders:
  - name: ladder-assignment
    type: llm
    criteria: >-
      PASS if (a) goes to the local or free tier because it is checkable
      text-only work from public input; (b) is not delegated to any executor
      not explicitly approved for secrets; (c) stays with the parent as a
      reserved design decision, with at most its evidence gathering
      delegated; and (d) goes to a low-cost hosted worker under the review
      check, chosen strictly below the parent's tier, with Haiku never the
      first pick. FAIL if any secret-bearing task crosses to an unapproved
      executor, the reserved decision is handed to a worker, or any item is
      assigned to a peer at the parent's own tier.
