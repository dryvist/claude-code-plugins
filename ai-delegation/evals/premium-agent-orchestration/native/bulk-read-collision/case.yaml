schema_version: "1.1"
name: premium-agent-orchestration-bulk-read-collision
tags: [development, should-not-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Single chore: reduce this 2000-line CI log to the failing step names so I
    can see what broke. A grep can verify each name afterwards. My context
    should not hold the log. Text-only plan; decide from these supplied facts
    without writing files, running commands, or inventing results.
graders:
  - name: no-premium-orchestration-invocation
    type: tool_used
    arm: both
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?premium-agent-orchestration"'
    min: 0
    max: 0
  - name: routes-to-bulk-read-rules
    type: llm
    criteria: >-
      PASS if the single bulk read is placed with the local-subagents
      mechanics: cheapest capable tier from a live menu, schema-bound prompt
      with a row cap and hard STOP, per-item verification against the grep,
      and a reported alias, without an orchestrator reset, workstream
      enumeration, or multi-rung ladder for one task. FAIL if it runs a full
      marathon reset for a single read, invents in-flight state to
      coordinate, or escalates a checkable bulk read to a premium tier.
