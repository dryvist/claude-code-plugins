schema_version: "1.1"
name: skill-create-skill
tags: [development, should-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Create a reusable harness skill for checking a supplied bibliography for
    missing publication dates. Return its SKILL.md contents as text, with no
    file changes. It must distinguish absent dates from retrieval dates and
    exclude fetching or inventing dates. If required authoring guidance cannot
    be read, return the specific prerequisite blocker instead.
graders:
  - name: selected-skill-builder
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?skill-builder"'
  - name: usable-skill-artifact
    type: llm
    criteria: >-
      PASS if the response supplies a complete SKILL.md with name, third-person
      description, bibliography-review trigger, absence-versus-retrieval-date
      distinction, and no permission to invent or fetch dates; alternatively
      it names an actually unavailable mandatory authoring reference and stops.
      FAIL if it returns only an authoring plan or claims unmeasured evals passed.
