schema_version: "1.1"
name: agent-skill-collision
tags: [development, should-not-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Correct this reusable harness skill's description to use third person and
    specific triggers: "Use this to review agent output." Its only job is
    reviewing a supplied agent report for missing output fields; it never
    defines, changes, or promotes platform agents. Return one description.
graders:
  - name: excludes-platform-authoring
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-builder"'
    min: 0
    max: 0
    arm: both
  - name: scoped-description
    type: llm
    criteria: >-
      PASS if a third-person description targets reviewing supplied agent
      reports for missing output fields, or a missing authoring prerequisite is
      explicitly reported. FAIL if the answer broadens into platform creation
      or promotion, claims validation it did not perform, or uses an imperative
      description.
