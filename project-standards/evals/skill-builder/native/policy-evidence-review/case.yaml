schema_version: "1.1"
name: skill-policy-evidence-review
tags: [development, should-trigger, execution, discrimination]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Apply the estate's current acceptance policy to this public, synthetic
    evidence worksheet for a revised reusable harness skill. Review which
    gates are satisfied, what evidence the policy requires next, and whether
    this revision can be accepted. Installed policy reads are allowed; use
    the inline worksheet as the complete evidence fixture. Do not run evals,
    models, counters, or shell commands, write files, or contact services.
    The worksheet records passing schema, packaging, output, and privacy
    assertions in 3 fresh candidate sessions. Its acceptance-threshold fields
    are blank. It contains no selection traces, baseline arm, independent
    unseen acceptance results, latency, or cost measurements. Return only
    JSON with status, satisfied_gates, and required_evidence. Distinguish
    structural observations from behavioral acceptance; invent no results.
graders:
  - name: decision-fields
    type: regex
    pattern: '^\s*\{(?=[\s\S]*"status"\s*:)(?=[\s\S]*"satisfied_gates"\s*:)(?=[\s\S]*"required_evidence"\s*:)[\s\S]*\}\s*$'
  - name: selected-skill-builder
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"project-standards:skill-builder"'
  - name: acceptance-blocked
    type: llm
    criteria: >-
      PASS if the answer keeps acceptance blocked pending required evidence;
      FAIL otherwise.
  - name: passing-assertions-retained
    type: llm
    criteria: >-
      PASS if the answer retains the supplied passing schema, packaging,
      output, and privacy assertions as observations from 3 fresh candidate
      sessions; FAIL otherwise.
  - name: predeclared-numeric-gates
    type: llm
    criteria: >-
      PASS if the answer requires numeric gates fixed before candidate runs
      for activation precision and recall, correctness, privacy, latency,
      and cost, with zero boundary violations; FAIL otherwise.
  - name: implicit-selection-trials
    type: llm
    criteria: >-
      PASS if the answer requires actual implicit selection trials on
      positive and negative requests; FAIL otherwise.
  - name: previous-version-comparisons
    type: llm
    criteria: >-
      PASS if the answer requires repeated clean previous-version-only
      comparisons under identical frozen suites and settings; FAIL otherwise.
  - name: independent-unseen-acceptance
    type: llm
    criteria: >-
      PASS if the answer requires independent evaluator-owned unseen
      acceptance after freezing the candidate; FAIL otherwise.
  - name: measured-comparison-evidence
    type: llm
    criteria: >-
      PASS if the answer requires measured latency, cost, baseline deltas,
      and uncertainty; FAIL otherwise.
  - name: missing-data-unknown
    type: llm
    criteria: >-
      PASS if missing data stays unknown with no invented thresholds or
      results; FAIL otherwise.
