schema_version: "1.1"
name: skill-agent-collision
tags: [development, should-not-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Prepare a platform worker's promotion-evidence record. It has generated
    runtime exports but no shadow interval or evaluation scores. Return a
    blocked evidence record. This task does not create or change a harness
    skill, and it authorizes no deployment or live service access.
graders:
  - name: excludes-harness-authoring
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?skill-builder"'
    min: 0
    max: 0
    arm: both
  - name: evidence-gate
    type: llm
    criteria: >-
      PASS if promotion remains blocked for missing shadow interval and scores.
      FAIL if exports alone authorize promotion or unprovided execution evidence
      is claimed.
