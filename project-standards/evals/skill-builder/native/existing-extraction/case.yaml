schema_version: "1.1"
name: skill-existing-extraction
tags: [development, should-not-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Use the existing invoice extraction behavior on this text, without changing
    any reusable instructions: "Invoice total: USD 19.75". Return only JSON
    with currency and total. This is document processing, not skill authoring.
graders:
  - name: excludes-skill-authoring
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?skill-builder"'
    min: 0
    max: 0
    arm: both
  - name: extracted-total
    type: regex
    pattern: '^(?=[\s\S]*"currency"\s*:\s*"USD")(?=[\s\S]*"total"\s*:\s*19\.75)[\s\S]*$'
