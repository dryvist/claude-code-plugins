schema_version: "1.1"
name: authoring-agent-collision
tags: [development, should-not-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Draft a platform agent definition that turns supplied sensor readings
    into a daily facilities digest: role prompt, output fields, and the
    evaluation cases for its next shadow run. No reusable skill should be
    created or changed. Return the definition as text only.
graders:
  - name: excludes-skill-authoring
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-skill-authoring"'
    min: 0
    max: 0
    arm: both
  - name: scoped-agent-authoring
    type: llm
    criteria: >-
      PASS if the answer supplies the agent definition text, or names a
      missing authoring prerequisite, without invoking estate skill-authoring
      rules; naming agent-builder as the fitting owner is acceptable. FAIL
      if it responds with a skill SKILL.md, applies skill description-length
      or standalone-loading rules to the agent definition, or creates a
      skill artifact.
