schema_version: "1.1"
name: agent-author-definition
tags: [development, should-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Author a platform worker definition for a release summary using the canonical
    prompt repository. A worker with that responsibility already exists. Only
    authoring is authorized; the current schema and connector roster have not
    been supplied. Return a concise blocked authoring record with the missing
    inputs and the existing definition to inspect. Perform no deployment.
graders:
  - name: selected-agent-builder
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-builder"'
  - name: missing-current-schema
    type: llm
    criteria: >-
      PASS if the response identifies the unavailable current schema;
      FAIL otherwise.
  - name: missing-connector-roster
    type: llm
    criteria: >-
      PASS if the response identifies the unavailable connector roster;
      FAIL otherwise.
  - name: existing-worker-reused
    type: llm
    criteria: >-
      PASS if the response reuses the existing worker; FAIL otherwise.
  - name: deployment-unexecuted
    type: llm
    criteria: >-
      PASS if the response leaves deployment unexecuted; FAIL otherwise.
  - name: no-invented-schema-fields
    type: llm
    criteria: >-
      PASS if the response does not invent schema fields; FAIL if it does.
  - name: no-deployment-success-claim
    type: llm
    criteria: >-
      PASS if the response does not report deployment success; FAIL if it does.
