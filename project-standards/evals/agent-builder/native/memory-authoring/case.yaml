schema_version: "1.1"
name: agent-memory-authoring
tags: [development, should-trigger, execution, discrimination]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Review a proposed platform agent that stores learned rules in a shared
    memory record. Learned rules carry no evidence reference and no confirmed
    or unconfirmed status, any concurrent writer rewrites the shared summary
    in place, and no one is named to correct or retire a wrong rule. The same
    proposal adds a compiled persistent memory without comparing it against
    retrieval alone, and its evaluation plan reports no cost for creating or
    updating that memory. Return only JSON with status and corrections for
    stored-rule hygiene, writer ownership, and the memory decision. Decide
    from these supplied facts; do not create files, run the agent, or contact
    services.
graders:
  - name: selected-agent-builder
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-builder"'
  - name: stored-rule-evidence-and-status
    type: llm
    criteria: >-
      PASS if every learned or stored rule gets an evidence reference and a
      confirmed or unconfirmed status, with a named authority who corrects or
      retires it against its source; FAIL if status-free rules are accepted.
  - name: single-writer-append-only
    type: llm
    criteria: >-
      PASS if one writer per shared source record is required, writers append
      to their own records, key facts are preserved exactly, and no writer
      rewrites a shared summary; FAIL if in-place shared rewrites remain.
  - name: memory-compared-with-retrieval
    type: llm
    criteria: >-
      PASS if the compiled memory is adopted only after comparison with
      retrieval alone on the same simple-lookup and cross-source tasks;
      FAIL if the memory is accepted without that comparison.
  - name: full-memory-cost-reported
    type: llm
    criteria: >-
      PASS if accuracy, citation consistency, latency, and the full cost of
      creating and updating the memory are required in the evaluation report;
      FAIL if the cost of creating and updating memory stays unreported.
