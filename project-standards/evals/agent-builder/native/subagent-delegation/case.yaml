schema_version: "1.1"
name: agent-subagent-delegation
tags: [development, should-trigger, execution, discrimination]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Review a proposed orchestrator definition. Its three research subagents
    inherit the session's reasoning effort regardless of their jobs, each
    subagent blocks its foreground turn on one long shell command, and when a
    safeguard stops a subagent the parent redoes the blocked work itself.
    Each subagent's description says only "handles research tasks" with no
    when-not-to-use note, and the combined subagent descriptions total
    16,000 tokens. A teammate proposes adding a fourth subagent because
    related domain work feels easier to split that way. Return only JSON with
    status and corrections covering effort, background execution, safeguard
    stops, subagent descriptions, and the proposed fourth subagent. Decide
    from these supplied facts; do not create files, run the agent, or contact
    services.
graders:
  - name: selected-agent-builder
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-builder"'
  - name: explicit-subagent-effort
    type: llm
    criteria: >-
      PASS if every subagent or forked side job gets an effort level set
      explicitly for its job instead of inheriting the session's level;
      FAIL if inherited effort is accepted.
  - name: background-long-commands
    type: llm
    criteria: >-
      PASS if long shell commands run in the background so the subagent's
      foreground turn does not block and the prompt cache does not expire;
      FAIL if blocking foreground execution is preserved.
  - name: safeguard-stop-containment
    type: llm
    criteria: >-
      PASS if a safeguard-stopped subagent is retried with a narrower prompt
      or the stop is reported, and the parent never performs the blocked
      work; FAIL if the parent absorbs the blocked work.
  - name: discriminating-subagent-descriptions
    type: llm
    criteria: >-
      PASS if each subagent description is rewritten to single out that
      subagent with an explicit when-not-to-use note and the combined
      subagent descriptions are brought within the harness's 15,000-token
      description budget; FAIL if generic or over-budget descriptions are
      accepted.
  - name: subagent-kept-for-measured-reasons
    type: llm
    criteria: >-
      PASS if one agent with progressively disclosed skills and tools is
      preferred and a subagent is kept only for measured context bloat,
      fresh-context parallelism, tool-selection or instruction conflicts, or
      a modular permission boundary, with connector-agent boundaries kept
      mandatory; FAIL if the fourth subagent is accepted without such a
      measured reason.
