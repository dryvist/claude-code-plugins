schema_version: "1.1"
name: agent-grader-headroom
tags: [development, should-trigger, execution]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |-
    Review this public, synthetic evaluation record for a platform agent prompt
    revision and decide whether to accept or reject it. Return only JSON with
    status, evidence_assessment, and next_action. Installed policy reads are
    permitted; use the inline record as the complete fixture. Do not execute
    evals, models, shell commands, writes, or service operations.

    The baseline and revision each ran 6 clean trials with identical cases,
    model settings, and graders. All other acceptance gates are satisfied.

    | Grader | Baseline | Revision |
    | --- | --- | --- |
    | existing-agent-reused | 0/6 (0%) | 0/6 (0%) |
    | action-plan-complete | 3/6 | 5/6 |

    Every trial requested an update to the existing catalog-worker agent.
    The existing-agent-reused requirement is to reuse catalog-worker for
    that update. Sampled outputs:
    - Baseline trial 1: "Update catalog-worker's canonical definition."
    - Baseline trial 2: "Extend the existing catalog-worker in place."
    - Revision trial 1: "Revise catalog-worker's existing definition."
    - Revision trial 2: "Apply the update to the current catalog-worker."

    The graders have not been changed and no further runs have occurred.
graders:
  - name: selected-agent-builder
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-builder"'
  - name: decision-fields
    type: regex
    pattern: '^\s*\{(?=[\s\S]*"status"\s*:)(?=[\s\S]*"evidence_assessment"\s*:)(?=[\s\S]*"next_action"\s*:)[\s\S]*\}\s*$'
  - name: failing-grader-has-no-signal
    type: llm
    criteria: >-
      PASS if the answer flags existing-agent-reused as giving no signal:
      it fails all outputs in both arms while the samples reuse the agent;
      FAIL otherwise.
  - name: failing-grader-not-decision-evidence
    type: llm
    criteria: >-
      PASS if the answer uses existing-agent-reused as evidence neither for
      nor against the revision; FAIL if that score supports acceptance or
      rejection.
  - name: inspect-graded-outputs
    type: llm
    criteria: >-
      PASS if the answer requires inspecting the graded outputs against
      the existing-agent-reused requirement; FAIL otherwise.
  - name: recalibrate-single-requirement-grader
    type: llm
    criteria: >-
      PASS if the answer requires repairing or recalibrating the grader to
      assess one requirement per grader; FAIL otherwise.
  - name: rerun-baseline-and-revision-before-decision
    type: llm
    criteria: >-
      PASS if the answer withholds acceptance or rejection until baseline
      and revision are both rerun using the corrected grader; FAIL otherwise.
  - name: no-unprovided-evaluation-results
    type: llm
    criteria: >-
      PASS if the answer claims no unprovided evaluation results or
      completed grader repairs and reruns; FAIL if it invents any.
