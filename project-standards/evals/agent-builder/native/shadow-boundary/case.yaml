schema_version: "1.1"
name: agent-shadow-boundary
tags: [development, should-trigger, execution, discrimination]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Review a platform worker's promotion record using the applicable platform
    authoring policy. All conformance, render-drift, development and independent
    held-out promptfoo checks pass. The versioned dataset exists, import and
    execution are verified, and correlated trace receipts and baseline scores
    cover the whole interval without score decline or missing coverage. The
    uninterrupted shadow interval starts 2026-11-01T03:00:00Z and the latest
    evidence ends 2026-11-08T02:00:00Z. Return only JSON with status,
    earliest_review_time, remaining_hours, and next_action. Assess only these
    supplied facts; no file changes or operations are authorized.
graders:
  - name: selected-agent-builder
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-builder"'
  - name: exact-shadow-boundary
    type: regex
    pattern: '^(?=[\s\S]*"earliest_review_time"\s*:\s*"2026-11-08T03:00:00Z")(?=[\s\S]*"remaining_hours"\s*:\s*1\s*[,}])[\s\S]*$'
  - name: final-hour-promotion-blocked
    type: llm
    criteria: >-
      PASS if promotion stays blocked pending the final hour of a 7-day shadow
      interval; FAIL if it promotes now or does not keep promotion blocked.
  - name: continued-shadow-coverage
    type: llm
    criteria: >-
      PASS if the answer requires continued coverage through the remaining
      shadow interval; FAIL otherwise.
  - name: shadow-scores-no-drop
    type: llm
    criteria: >-
      PASS if the answer requires no score drop through the remaining shadow
      interval; FAIL otherwise.
  - name: promotion-review-pr
    type: llm
    criteria: >-
      PASS if the answer routes the mode change through a promotion-review PR
      after the shadow interval; FAIL otherwise.
  - name: supervising-lead-review
    type: llm
    criteria: >-
      PASS if the answer requires supervising lead review of the mode change;
      FAIL otherwise.
  - name: supervising-lead-merge
    type: llm
    criteria: >-
      PASS if the answer leaves merging the mode change to the supervising
      lead; FAIL otherwise.
  - name: no-arbitrary-longer-interval
    type: llm
    criteria: >-
      PASS if the answer does not substitute an arbitrary longer shadow
      interval; FAIL if it does.
  - name: no-live-trial-substitution
    type: llm
    criteria: >-
      PASS if the answer does not substitute a live trial for the shadow
      interval; FAIL if it does.
  - name: no-direct-mode-publication
    type: llm
    criteria: >-
      PASS if the answer does not directly publish a mode flip;
      FAIL if it does.
  - name: no-future-evidence-claims
    type: llm
    criteria: >-
      PASS if the answer does not claim future evidence; FAIL if it does.
