schema_version: "1.1"
name: agent-dify-contract-pins
tags: [development, should-trigger, execution, discrimination]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Review a Dify import plan for a platform agent. The plan imports the app
    and its code sandbox without pinning their contracts together, records
    no build snapshot for the published version, and leaves skill versions
    floating so a later run can pick up different skill content. Return only
    JSON with status and corrections covering the import and reproducibility
    records. Decide from these supplied facts; do not create files, run
    imports, or contact services.
graders:
  - name: selected-agent-builder
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-builder"'
  - name: contracts-pinned-together
    type: llm
    criteria: >-
      PASS if the application and sandbox contracts are pinned together for
      the import; FAIL if the unpinned pair is accepted.
  - name: snapshots-and-skill-versions-preserved
    type: llm
    criteria: >-
      PASS if build snapshots are preserved and skill versions are recorded
      so the published version reproduces; FAIL if floating skill versions
      without snapshots are accepted.
