schema_version: "1.1"
name: agent-existing-run
tags: [development, should-not-trigger]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Run an existing release-summary worker for the last day. Its definition
    must remain unchanged. No execution connector or service access is
    available in this session. State the execution blocker in one sentence.
graders:
  - name: excludes-agent-authoring
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-builder"'
    min: 0
    max: 0
    arm: both
  - name: execution-blocker
    type: llm
    criteria: >-
      PASS if the answer reports unavailable execution access without changing
      the definition or claiming the worker ran. FAIL otherwise.
