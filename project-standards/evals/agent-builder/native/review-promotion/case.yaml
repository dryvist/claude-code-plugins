schema_version: "1.1"
name: agent-review-promotion
tags: [development, should-trigger, execution]
execution:
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    Review promotion evidence for a platform worker. Its generated exports and
    format checks pass, but the only run record covers 6 days in shadow and has
    no correlated trace receipts or baseline scores. Return only JSON containing
    status, missing_evidence, and next_action. Make a promotion decision from
    these supplied facts; do not execute any operation or propose a new agent.
graders:
  - name: selected-agent-builder
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-builder"'
  - name: decision-fields
    type: regex
    pattern: '^(?=[\s\S]*"status"\s*:)(?=[\s\S]*"missing_evidence"\s*:)(?=[\s\S]*"next_action"\s*:)[\s\S]*$'
  - name: promotion-blocked
    type: llm
    criteria: >-
      PASS if the JSON blocks promotion; FAIL otherwise.
      Grade the evidence decision, not prose.
  - name: incomplete-shadow-interval
    type: llm
    criteria: >-
      PASS if the answer identifies the incomplete 7-day shadow interval;
      FAIL otherwise.
  - name: missing-baseline-scores
    type: llm
    criteria: >-
      PASS if the answer identifies absent baseline scores; FAIL otherwise.
  - name: missing-trace-receipts
    type: llm
    criteria: >-
      PASS if the answer identifies absent trace receipts; FAIL otherwise.
  - name: format-checks-not-promotion-proof
    type: llm
    criteria: >-
      PASS if the answer does not treat format checks as authorization for
      live promotion; FAIL if it does.
  - name: six-days-not-promotion-proof
    type: llm
    criteria: >-
      PASS if the answer does not treat the 6-day record as authorization for
      live promotion; FAIL if it does.
  - name: no-unprovided-run-results
    type: llm
    criteria: >-
      PASS if the answer does not claim any unprovided run result;
      FAIL if it does.
